<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E4FD8">
<title>Institut Mahaputra — LMS Akademik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Layar pemuatan: tampil sampai aplikasi siap; menampilkan galat jika skrip gagal dimuat -->
<div id="boot" style="position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F1F5F9;color:#0F172A;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px">
  <div class="bl" style="width:48px;height:48px;border-radius:12px;background:#1E4FD8;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;overflow:hidden">I</div>
  <div class="bt" style="font-weight:600">Memuat aplikasi…</div>
  <div class="bd2" style="font-size:12px;color:#64748B;max-width:520px;line-height:1.5"></div>
</div>
<script>
(function () {
  try {
    var cb = JSON.parse(localStorage.getItem('cs_brand') || 'null');
    if (cb && cb.nama) document.querySelector('#boot .bt').textContent = 'Memuat ' + cb.nama + '…';
  } catch (e) { }
  // Jika app.js tidak termuat dalam 10 detik, tampilkan galat yang bisa ditindaklanjuti
  setTimeout(function () {
    if (window.__csLoaded) return;
    var b = document.getElementById('boot'); if (!b) return;
    b.querySelector('.bt').textContent = 'Aplikasi belum termuat';
    b.querySelector('.bt').style.color = '#BA1A1A';
    b.querySelector('.bd2').textContent = 'Periksa koneksi internet, pastikan GAS_URL di js/config.js sudah diisi, lalu muat ulang halaman (Ctrl+F5).';
  }, 10000);
})();
</script>

<!-- Layar masuk -->
<div id="login" class="hidden"></div>

<!-- Aplikasi (SPA satu halaman) -->
<div id="app" class="hidden">
  <aside class="side" id="side" aria-label="Navigasi utama"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <footer class="foot"><span>Institut Mahaputra &nbsp;|&nbsp; LMS Akademik</span><span><i class="bi bi-lightning-charge-fill" style="color:var(--pri)"></i> Powered by Google Apps Script</span></footer>
  </div>
  <nav class="bnav" id="bnav" aria-label="Navigasi bawah"></nav>
</div>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="print-root"></div>

<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
